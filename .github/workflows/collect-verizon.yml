name: Collect Verizon public pages

on:
  push:
    branches: [main]
    paths:
      - "config/targets.json"
      - "scripts/crawl.py"
      - "scripts/export_collection_status.py"
      - "scripts/build_evidence_pack.py"
      - "src/vzw_promo_tracker/**"
      - "tests/**"
      - ".github/workflows/collect-verizon.yml"
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verizon-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Test promotion extraction rules
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Crawl public Verizon pages
        run: python scripts/crawl.py
      - name: Export non-sensitive collection status
        run: python scripts/export_collection_status.py
      - name: Build public review package
        run: python scripts/build_evidence_pack.py
      - name: Preserve raw evidence as a private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: verizon-evidence-${{ github.run_id }}
          path: data/promotions.sqlite
          retention-days: 30
      - name: Commit collection status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/collection-status.json public/downloads/
          git diff --cached --quiet || git commit -m "chore: update Verizon collection status"
          git push
