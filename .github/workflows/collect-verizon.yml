name: Collect Verizon, AT&T and T-Mobile public pages

on:
  push:
    branches: [main]
    paths:
      - "config/targets.json"
      - "scripts/crawl.py"
      - "scripts/collect_grid_offers.py"
      - "scripts/collect_att.py"
      - "scripts/collect_tmobile.py"
      - "scripts/export_collection_status.py"
      - "scripts/build_evidence_pack.py"
      - "src/vzw_promo_tracker/**"
      - "tests/**"
      - ".github/workflows/collect-verizon.yml"
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      run_purchase_scenarios:
        description: "Run the slower PDP purchase-state matrix"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: verizon-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Test promotion extraction rules
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Crawl Verizon, AT&T and T-Mobile public pages
        run: python scripts/crawl.py
      - name: Collect all-brand grid cards and Details
        run: python scripts/collect_grid_offers.py
      - name: Collect AT&T brand cards and offer details
        run: python scripts/collect_att.py
      - name: Collect T-Mobile brand cards and offer details
        run: python scripts/collect_tmobile.py
      - name: Run verified PDP purchase scenarios
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_purchase_scenarios }}
        run: python scripts/run_scenarios.py
      - name: Export non-sensitive collection status
        run: python scripts/export_collection_status.py
      - name: Build public review package
        run: python scripts/build_evidence_pack.py
      - name: Preserve raw evidence as a private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: carrier-evidence-${{ github.run_id }}
          path: data/promotions.sqlite
          retention-days: 30
      - name: Commit collection status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/collection-status.json public/data/grid-offers.json public/data/att-snapshot.json public/data/tmobile-snapshot.json public/downloads/ public/screenshots/ public/grid-evidence/ public/att-evidence/ public/tmobile-evidence/
          git add public/data/scenario-results.json public/scenario-evidence/
          git diff --cached --quiet || git commit -m "chore: update Verizon collection status"
          git pull --rebase origin main
          git push
